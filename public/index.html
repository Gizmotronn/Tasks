<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><title>Piles</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css?v=5"></head><body>
<aside class="sidebar"><div class="sidebar-top"><div class="app-mark">P</div><span>Piles</span><span class="app-caption">Personal</span></div><nav id="nav" aria-label="Main navigation"></nav><div class="sidebar-bottom"><button id="account" class="account"><span class="avatar">L</span><span class="account-copy"><strong>Liam</strong><small id="account-state">Sign in to sync</small></span><span class="account-arrow">⌄</span></button><button id="sync-status" class="sync-status"><span class="status-dot"></span><span id="network">Saved on this device</span></button></div></aside>
<main><div class="toolbar"><span id="date"></span><button id="paste-link" class="toolbar-link">Paste a link</button><button id="add" class="toolbar-add" aria-label="New wish">＋</button></div><div class="page"><header><span id="heading-icon"></span><h1 id="title">Today</h1></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></div><div class="bottom-bar"><button id="bottom-add" class="text-button">＋ New wish</button><span>USD</span></div></main>
<dialog id="auth"><form id="login"><button type="button" class="dialog-close" data-close="auth" aria-label="Close">×</button><span class="login-mark">P</span><h2>Your Piles, everywhere.</h2><p class="muted">Sign in to sync your wishes, travel plans and savings.</p><label>Email<input name="email" type="email" value="liam@skinetics.tech" autocomplete="username" readonly></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your Explore password"></label><p id="login-error" role="alert"></p><button class="primary full" id="login-submit">Sign in</button><p class="form-note">Uses your existing Explore account.</p></form></dialog>
<dialog id="wish"><form id="wish-form"><button type="button" class="dialog-close" data-close="wish" aria-label="Close">×</button><h2>New wish</h2><label>Name<input name="title" required maxlength="120" placeholder="What would you like to save for?" autofocus></label><div class="cols"><label>Target · USD<input name="target" type="number" min="0.01" max="10000000" step="0.01" required placeholder="0.00"></label><label>Target date<input name="deadline" type="date"></label></div><div class="cols"><label>List<select name="kind"><option value="wish">Wishlist</option><option value="travel">Travel</option></select></label><label>Priority<select name="priority"><option value="2">Normal</option><option value="3">High</option><option value="1">Later</option></select></label></div><label>Notes<textarea name="notes" placeholder="Details, requirements, a reason to look forward to it…"></textarea></label><div class="actions"><button type="button" data-close="wish">Cancel</button><button class="primary">Add wish</button></div></form></dialog>
<dialog id="capture"><form id="capture-form"><button type="button" class="dialog-close" data-close="capture" aria-label="Close">×</button><h2 id="capture-title"></h2><div id="capture-fields"></div><div class="actions"><button type="button" data-close="capture">Cancel</button><button class="primary">Save</button></div></form></dialog>
<dialog id="listing-dialog"><button type="button" class="dialog-close" data-close="listing-dialog" aria-label="Close">×</button><h2>Save a listing</h2><form id="link-form"><label>Listing link<input name="url" type="url" required placeholder="https://…" autocomplete="off"></label><button class="primary" id="interpret">Read listing</button></form><p id="listing-status" class="muted" role="status"></p><form id="listing-form" hidden><label>Title<input name="title" maxlength="300" required></label><div class="cols"><label>Price<input name="price" type="number" min="0" max="10000000" step="0.01"></label><label>Currency<input name="currency" maxlength="3" pattern="[A-Za-z]{3}" placeholder="USD"></label></div><div class="cols"><label>Seller<input name="seller" maxlength="200"></label><label>Condition<input name="condition" maxlength="100"></label></div><label>Notes<textarea name="description" maxlength="4000"></textarea></label><label>Collection<select name="collectionId"></select></label><label class="checkbox-label"><input type="checkbox" name="wishlist"> Also add to Wishlist (USD price required)</label><p class="form-note">Check the price, shipping and availability on the original listing.</p><div class="actions"><button type="button" data-close="listing-dialog">Cancel</button><button class="primary">Save listing</button></div></form></dialog>
<dialog id="membership-dialog"><form id="membership-form"><button type="button" class="dialog-close" data-close="membership-dialog" aria-label="Close">×</button><h2>Save to collections</h2><div id="membership-options"></div><div class="actions"><button type="button" id="membership-create">New collection</button><button class="primary">Save</button></div></form></dialog>
<script type="module" src="/app.js?v=5"></script></body></html>
