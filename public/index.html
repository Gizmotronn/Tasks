<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Piles · Tasks</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head><body>
<aside><a class="brand" href="#">◒ <strong>Piles</strong></a><small>A little closer, every day.</small><nav><button data-view="Today">☀ Today</button><button data-view="Wishlist">☆ Wishlist</button><button data-view="Travel">↗ Travel</button><button data-view="Progress">✓ Progress</button><button data-view="Watching">⌕ Watching</button><button data-view="Settings">⚙ Settings</button></nav><footer><span id="network"></span><p>Part of Tasks</p></footer></aside>
<main><header><div><small id="date"></small><h1 id="title">Today</h1></div><button id="add">＋ New wish</button></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main>
<dialog id="wish"><form id="wish-form"><h2>Something to look forward to</h2><label>Name<input name="title" required maxlength="120" placeholder="MacBook Pro · M3 Pro or later"></label><div class="cols"><label>Target amount<input name="target" type="number" min="0.01" max="10000000" step="0.01" required></label><label>Needed by<input name="deadline" type="date"></label></div><div class="cols"><label>Kind<select name="kind"><option value="wish">Wishlist</option><option value="travel">Travel</option></select></label><label>Priority<select name="priority"><option value="2">Normal</option><option value="3">High</option><option value="1">Later</option></select></label></div><label>Notes<textarea name="notes" placeholder="Requirements, destination, or why this matters"></textarea></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save wish</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
